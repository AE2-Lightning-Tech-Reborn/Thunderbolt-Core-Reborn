// Real NeoECO development artifacts only. Keep probes outside production packaging.
if (gradle.startParameter.taskNames.any { it.tokenize(':').last() in ['build', 'jar', 'jarJar', 'verifyReleaseJar'] }) {
    throw new GradleException('Run NeoECO acceptance separately from release packaging')
}
allprojects {
    def localMaven = providers.gradleProperty('neoEcoAcceptanceMaven').getOrElse('').trim()
    if (!localMaven.isEmpty()) {
        repositories {
            exclusiveContent {
                forRepository { maven { url = uri(localMaven) } }
                filter { includeVersion 'maven.modrinth', 'ldlib', 'mc1.20.1-1.0.33.b-forge' }
            }
        }
    }
    afterEvaluate {
        def neoEco = providers.gradleProperty('neoEcoAcceptanceJar').getOrElse('')
        def registrate = providers.gradleProperty('neoEcoAcceptanceRegistrate').getOrElse('')
        if (!file(neoEco).isFile() || !file(registrate).isFile())
            throw new GradleException('Supply Mojang-mapped NeoECO and Registrate development jars')
        dependencies.add('runtimeOnly', files(neoEco, registrate))
        dependencies.add('runtimeOnly', fg.deobf('maven.modrinth:ldlib:mc1.20.1-1.0.33.b-forge'))
        sourceSets.create('neoEcoAcceptance') {
            java.srcDir rootProject.file('src/neoEcoGameTest/java')
            resources.srcDir rootProject.file('src/compatibilityGameTest/resources')
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += output + sourceSets.main.runtimeClasspath
        }
        tasks.named('processResources') {
            outputs.upToDateWhen { false }
            doLast {
                def configFile = rootProject.file('build/resources/main/thunderbolt.mixins.json')
                def config = new groovy.json.JsonSlurper().parse(configFile)
                config.mixins.add('neoecoacceptance.BusCallProbeMixin')
                configFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(config))
            }
        }
        minecraft.runs.gameTestServer {
            property 'forge.enabledGameTestNamespaces', 'thunderbolt'
            property 'forge.logging.console.level', 'info'
            property 'thunderbolt.gtlCompat', 'never'
            property 'thunderbolt.mixinAudit', 'false'
            property 'fml.doNotBackup', 'true'
            property 'fml.doNotConfirm', 'true'
            property 'java.io.tmpdir', file(providers.gradleProperty('neoEcoAcceptanceTemp').get()).absolutePath
            mods { thunderbolt { source sourceSets.neoEcoAcceptance } }
        }
        tasks.register('restoreNeoEcoAcceptanceResources') {
            doLast {
                rootProject.file('build/resources/main/thunderbolt.mixins.json').bytes =
                        rootProject.file('src/main/resources/thunderbolt.mixins.json').bytes
            }
        }
        tasks.named('compileNeoEcoAcceptanceJava') {
            options.incremental = false
        }
        tasks.matching { it.name == 'runGameTestServer' }.configureEach {
            dependsOn 'neoEcoAcceptanceClasses'
            finalizedBy 'restoreNeoEcoAcceptanceResources'
            doLast {
                def runDirectory = file(providers.gradleProperty('thunderboltDevGameDirectory').get())
                def log = new File(runDirectory, 'logs/latest.log').getText('UTF-8')
                if (!log.contains('All 3 required tests passed'))
                    throw new GradleException('Expected all three real NeoECO acceptance tests to run')
            }
        }
        tasks.matching { it.name == 'downloadMCMeta' }.configureEach {
            onlyIf { !rootProject.file('build/downloadMCMeta/version.json').isFile() }
        }
    }
}
