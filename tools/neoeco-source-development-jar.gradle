// Apply to an unmodified NeoECO Forge source checkout, separately from this project.
allprojects {
    afterEvaluate {
        tasks.named('compileJava') { outputs.upToDateWhen { false } }
        tasks.register('neoEcoAcceptanceDevJar', Jar) {
            dependsOn 'classes'
            from sourceSets.main.output
            archiveClassifier = 'machine-acceptance-dev'
            manifest.from tasks.named('jar', Jar).get().manifest
        }
    }
}
