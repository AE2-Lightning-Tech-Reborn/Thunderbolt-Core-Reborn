name: Validate release workflow

on:
  push:
    branches: [main, '1.20.1']
    paths: ['.github/**', 'build.gradle']
  pull_request:
    paths: ['.github/**', 'build.gradle']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test release types, dependency downloads, and JAR validation
        run: python3 .github/scripts/test_release.py

      - name: Set up Java for build configuration validation
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verify Gradle preserves the release tag
        env:
          TAG: 2.0.2-beta
        run: |
          set -euo pipefail
          actual="$(bash ./gradlew --no-daemon --max-workers 1 -q printProjectVersion -Pmod_version=0.0.0)"
          test "$actual" = "$TAG" || { echo "Unexpected Gradle release version: $actual" >&2; exit 1; }

      - name: Lint GitHub Actions workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/actionlint"
          gh release download v1.7.12 --repo rhysd/actionlint \
            --pattern actionlint_1.7.12_linux_amd64.tar.gz --dir "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/actionlint/actionlint_1.7.12_linux_amd64.tar.gz" -C "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/actionlint/actionlint" -shellcheck= -pyflakes= .github/workflows/*.yml
