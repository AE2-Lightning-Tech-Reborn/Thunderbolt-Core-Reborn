org.gradle.daemon=true
org.gradle.parallel=true
# Mixin's annotation processor is not compatible with the configuration cache.
org.gradle.configuration-cache=false
# build.gradle explicitly tracks Mixin AP refmaps/mappings and verifies the release jar.
org.gradle.caching=true

